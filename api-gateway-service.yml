server.port: 8080

app:
  security:
    trust-inbound-headers: false
    public-routes:
      - "/v1/auth/**"
      - "/webhook/**"
  rate-limit:
    method: fixed
    use-case:
      api-key:
        requests-per-minute: 200

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: merchant-service
              uri: lb://merchant-service
              predicates:
                - Path=/v1/auth/**, /v1/merchants/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/v1/orders/**, /v1/payments/**

            - id: vault-service
              uri: lb://vault-service
              predicates:
                - Path=/v1/vault/**

            - id: operations-service
              uri: lb://operations-service
              predicates:
                - Path=/webhook/**

jwt:
  secret-key: ${JWT_SECRET:K4vR2C+2fPmw8Qv8+Z7u0x3M0ehjv4s8l4m4B8VQ6jQp}
